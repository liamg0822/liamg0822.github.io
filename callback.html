<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход в TikTok</title><link rel="stylesheet" href="style.css">
<main><h1 id="h">Почти готово</h1>
<p id="p">Скопируй адрес ниже и пришли его боту в Telegram одним сообщением.</p>
<textarea id="u" readonly></textarea><br><button id="b">Скопировать</button></main>
<script>
var u=document.getElementById("u");u.value=location.href;
if(!/[?&]code=/.test(location.search)){document.getElementById("h").textContent="Вход не завершён";
document.getElementById("p").textContent="В адресе нет кода входа. Вернись к боту и нажми «🔑 Подключить» ещё раз.";}
document.getElementById("b").onclick=function(){u.select();try{navigator.clipboard.writeText(u.value)}catch(e){document.execCommand("copy")}this.textContent="Скопировано";};
</script></html>
